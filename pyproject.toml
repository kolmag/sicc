[project]
name = "sicc"
version = "0.1.0"
description = "Supplier Intelligence Command Center — ML risk scoring, hybrid RAG, and agentic supplier workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "scikit-learn>=1.4",
    "numpy>=1.26",
    "shap>=0.49.1",
    "faker>=40.15.0",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "streamlit>=1.57.0",
    "xgboost>=3.2.0",
    "rank-bm25>=0.2.2",
    "langfuse>=4.6.1",
    "langchain-text-splitters>=1.1.2",
    "tiktoken>=0.12.0",
    "litellm>=1.83.14",
    "anthropic>=0.100.0",
    "chromadb>=0.4,<0.6",
    "openai>=2.24.0",
    "python-dotenv>=1.2.2",
    "tqdm>=4.67.3",
    "tenacity>=9.1.4",
    "groq>=1.2.0",
]

[tool.uv]
constraint-dependencies = [
    "numba>=0.59",
    "llvmlite>=0.40",
    "onnxruntime>=1.16.0,<1.20.0",
]

